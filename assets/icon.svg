<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ibg" cx="50%" cy="38%" r="76%">
      <stop offset="0%"  stop-color="#22314f"/>
      <stop offset="60%" stop-color="#111828"/>
      <stop offset="100%" stop-color="#080b13"/>
    </radialGradient>

    <linearGradient id="iscreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#9df3ff"/>
      <stop offset="50%" stop-color="#3fc9e8"/>
      <stop offset="100%" stop-color="#1b6fa8"/>
    </linearGradient>

    <linearGradient id="igold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffe89a"/>
      <stop offset="50%" stop-color="#f0c33e"/>
      <stop offset="100%" stop-color="#cf9615"/>
    </linearGradient>

    <linearGradient id="idFace" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9dce4"/>
    </linearGradient>

    <linearGradient id="idSide" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"  stop-color="#b4b9c5"/>
      <stop offset="100%" stop-color="#868c9b"/>
    </linearGradient>

    <linearGradient id="idTop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4c9d4"/>
    </linearGradient>

    <filter id="iglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="idrop" x="-40%" y="-40%" width="180%" height="195%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15"/>
      <feOffset dx="0" dy="12" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.6"/>
      <feComposite in2="off" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="0" fill="url(#ibg)"/>

  <!-- glow pool -->
  <ellipse cx="256" cy="300" rx="210" ry="120" fill="#3fc9e8" opacity="0.16" filter="url(#iglow)"/>

  <!-- ===== TV, sat behind ===== -->
  <g filter="url(#idrop)" transform="translate(256 214)">
    <rect x="-176" y="-118" width="352" height="236" rx="18" fill="#333844"/>
    <rect x="-176" y="-118" width="352" height="236" rx="18" fill="none" stroke="#5d6577" stroke-width="4"/>
    <rect x="-152" y="-94" width="304" height="188" rx="10" fill="url(#iscreen)"/>
    <!-- scanlines -->
    <g opacity="0.15" fill="#04121c">
      <rect x="-152" y="-84" width="304" height="5"/><rect x="-152" y="-56" width="304" height="5"/>
      <rect x="-152" y="-28" width="304" height="5"/><rect x="-152" y="0"   width="304" height="5"/>
      <rect x="-152" y="28"  width="304" height="5"/><rect x="-152" y="56"  width="304" height="5"/>
    </g>
    <!-- sheen -->
    <path d="M-152 60 L-152 -94 L-20 -94 L-112 94 L-152 94 Z" fill="#ffffff" opacity="0.14"/>
    <!-- stand -->
    <rect x="-26" y="118" width="52" height="34" fill="#2a2e38"/>
    <rect x="-84" y="148" width="168" height="20" rx="9" fill="#333844"/>
  </g>

  <!-- ===== DICE, front and centre ===== -->
  <g filter="url(#idrop)" transform="translate(256 330) rotate(-12)">
    <path d="M0 -104 L100 -52 L0 0 L-100 -52 Z" fill="url(#idTop)"/>
    <path d="M-100 -52 L0 0 L0 112 L-100 60 Z" fill="url(#idSide)"/>
    <path d="M100 -52 L100 60 L0 112 L0 0 Z" fill="url(#idFace)"/>
    <g fill="none" stroke="#6f7686" stroke-width="3" opacity="0.45">
      <path d="M0 -104 L100 -52 L0 0 L-100 -52 Z"/>
      <path d="M-100 -52 L0 0 L0 112 L-100 60 Z"/>
      <path d="M100 -52 L100 60 L0 112 L0 0 Z"/>
    </g>
    <!-- six pips on the lit face -->
    <g fill="#1b1f29">
      <ellipse cx="28" cy="20" rx="10" ry="12"/>
      <ellipse cx="28" cy="55" rx="10" ry="12"/>
      <ellipse cx="28" cy="90" rx="10" ry="12"/>
      <ellipse cx="74" cy="-4" rx="10" ry="12"/>
      <ellipse cx="74" cy="31" rx="10" ry="12"/>
      <ellipse cx="74" cy="66" rx="10" ry="12"/>
    </g>
    <!-- three pips on the shaded face -->
    <g fill="#3a4150">
      <ellipse cx="-74" cy="-2" rx="9" ry="11"/>
      <ellipse cx="-50" cy="38" rx="9" ry="11"/>
      <ellipse cx="-26" cy="78" rx="9" ry="11"/>
    </g>
  </g>

  <!-- ===== TVs wordmark ===== -->
  <text x="256" y="484" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="bold" font-size="82" letter-spacing="-2" fill="url(#igold)" filter="url(#iglow)">TVs</text>

  <!-- gold rim so it reads as a tile -->
  <rect x="4" y="4" width="504" height="504" rx="0" fill="none" stroke="#f0c33e" stroke-width="6" opacity="0.5"/>
</svg>
