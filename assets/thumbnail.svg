<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="62%" cy="42%" r="78%">
      <stop offset="0%"  stop-color="#1d2a44"/>
      <stop offset="55%" stop-color="#101627"/>
      <stop offset="100%" stop-color="#070a12"/>
    </radialGradient>

    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffe89a"/>
      <stop offset="45%" stop-color="#f0c33e"/>
      <stop offset="100%" stop-color="#d29a19"/>
    </linearGradient>

    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#9df3ff"/>
      <stop offset="45%" stop-color="#3fc9e8"/>
      <stop offset="100%" stop-color="#1b6fa8"/>
    </linearGradient>

    <linearGradient id="diceFace" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcdfe6"/>
    </linearGradient>

    <linearGradient id="diceSide" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"  stop-color="#b9bec9"/>
      <stop offset="100%" stop-color="#8d93a1"/>
    </linearGradient>

    <linearGradient id="diceTop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c9ced8"/>
    </linearGradient>

    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3a3f4b"/>
      <stop offset="100%" stop-color="#23262f"/>
    </linearGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="tightGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="drop" x="-30%" y="-30%" width="170%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24"/>
      <feOffset dx="0" dy="20" result="off"/>
      <feFlood flood-color="#000000" flood-opacity="0.62"/>
      <feComposite in2="off" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- floor sheen -->
  <ellipse cx="1240" cy="880" rx="560" ry="90" fill="#3fc9e8" opacity="0.10" filter="url(#softGlow)"/>

  <!-- ================= TV ================= -->
  <g filter="url(#drop)" transform="translate(1240 470)">
    <!-- bezel -->
    <rect x="-390" y="-250" width="780" height="500" rx="26" fill="url(#cabinet)"/>
    <rect x="-390" y="-250" width="780" height="500" rx="26" fill="none" stroke="#5a6273" stroke-width="4"/>
    <!-- screen -->
    <rect x="-352" y="-212" width="704" height="424" rx="14" fill="url(#screenGlow)"/>
    <!-- scanlines -->
    <g opacity="0.16" fill="#04121c">
      <rect x="-352" y="-212" width="704" height="424" rx="14" fill="none"/>
      <g>
        <rect x="-352" y="-198" width="704" height="6"/><rect x="-352" y="-162" width="704" height="6"/>
        <rect x="-352" y="-126" width="704" height="6"/><rect x="-352" y="-90"  width="704" height="6"/>
        <rect x="-352" y="-54"  width="704" height="6"/><rect x="-352" y="-18"  width="704" height="6"/>
        <rect x="-352" y="18"   width="704" height="6"/><rect x="-352" y="54"   width="704" height="6"/>
        <rect x="-352" y="90"   width="704" height="6"/><rect x="-352" y="126"  width="704" height="6"/>
        <rect x="-352" y="162"  width="704" height="6"/><rect x="-352" y="198"  width="704" height="6"/>
      </g>
    </g>
    <!-- specular sweep -->
    <path d="M-352 130 L-352 -212 L-40 -212 L-250 212 L-352 212 Z" fill="#ffffff" opacity="0.13"/>
    <!-- value on screen -->
    <text x="0" y="-38" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-weight="bold" font-size="150" fill="#062232" opacity="0.9">£50,000</text>
    <text x="0" y="30" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-weight="bold" font-size="44" letter-spacing="9" fill="#0a2c3f" opacity="0.66">THE INFINITE SCREEN</text>
    <!-- stand -->
    <rect x="-46" y="250" width="92" height="66" fill="#2b2f39"/>
    <rect x="-170" y="310" width="340" height="30" rx="14" fill="#333844"/>
  </g>

  <!-- ================= DICE ================= -->
  <g filter="url(#drop)" transform="translate(910 692) rotate(-13) scale(0.92)">
    <!-- top face -->
    <path d="M0 -128 L124 -66 L0 -4 L-124 -66 Z" fill="url(#diceTop)"/>
    <!-- left face -->
    <path d="M-124 -66 L0 -4 L0 132 L-124 70 Z" fill="url(#diceSide)"/>
    <!-- right face -->
    <path d="M124 -66 L124 70 L0 132 L0 -4 Z" fill="url(#diceFace)"/>
    <!-- edges -->
    <g fill="none" stroke="#6f7686" stroke-width="3" opacity="0.5">
      <path d="M0 -128 L124 -66 L0 -4 L-124 -66 Z"/>
      <path d="M-124 -66 L0 -4 L0 132 L-124 70 Z"/>
      <path d="M124 -66 L124 70 L0 132 L0 -4 Z"/>
    </g>
    <!-- pips: six on the bright right face -->
    <g fill="#1b1f29">
      <ellipse cx="34"  cy="18"  rx="12" ry="14"/>
      <ellipse cx="34"  cy="60"  rx="12" ry="14"/>
      <ellipse cx="34"  cy="102" rx="12" ry="14"/>
      <ellipse cx="92"  cy="-10" rx="12" ry="14"/>
      <ellipse cx="92"  cy="32"  rx="12" ry="14"/>
      <ellipse cx="92"  cy="74"  rx="12" ry="14"/>
    </g>
    <!-- pips: three on the shaded left face -->
    <g fill="#3a4150" opacity="0.95">
      <ellipse cx="-92" cy="-6"  rx="11" ry="13"/>
      <ellipse cx="-62" cy="42"  rx="11" ry="13"/>
      <ellipse cx="-32" cy="90"  rx="11" ry="13"/>
    </g>
  </g>

  <!-- ================= TITLE ================= -->
  <g transform="translate(120 300)">
    <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold"
          font-size="140" letter-spacing="-2" fill="#ffffff">ROLL</text>
    <text y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold"
          font-size="140" letter-spacing="-2" fill="#ffffff">FOR</text>
    <text y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold"
          font-size="180" letter-spacing="-4" fill="url(#goldText)" filter="url(#tightGlow)">TVs</text>
  </g>

  <!-- strapline -->
  <text x="126" y="668" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="bold" font-size="42" fill="#9fb0c8" letter-spacing="1">Roll a six. Upgrade your dice.</text>
  <text x="126" y="722" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="bold" font-size="42" fill="#9fb0c8" letter-spacing="1">Collect all 30 TVs.</text>

  <!-- ================= TIER LADDER ================= -->
  <g transform="translate(126 812)">
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="bold" font-size="23">
      <!-- Basic -->
      <rect x="0" y="0" width="128" height="54" rx="12" fill="#EBEBEB"/>
      <text x="64" y="35" text-anchor="middle" fill="#1b1f29">JUNK</text>
      <!-- Bronze -->
      <rect x="146" y="0" width="128" height="54" rx="12" fill="#C47A3A"/>
      <text x="210" y="35" text-anchor="middle" fill="#1b1206">COMMON</text>
      <!-- Silver -->
      <rect x="292" y="0" width="128" height="54" rx="12" fill="#BEC6D2"/>
      <text x="356" y="35" text-anchor="middle" fill="#1b1f29">DECENT</text>
      <!-- Gold -->
      <rect x="438" y="0" width="128" height="54" rx="12" fill="#F0C33E"/>
      <text x="502" y="35" text-anchor="middle" fill="#231a02">ELITE</text>
      <!-- Diamond -->
      <rect x="584" y="0" width="170" height="54" rx="12" fill="#78E2F0"/>
      <text x="669" y="35" text-anchor="middle" fill="#05242b">LEGENDARY</text>
    </g>
    <text x="0" y="112" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-weight="bold" font-size="30" fill="#6d7f97" letter-spacing="2">5 DICE  ·  30 TVs  ·  £5 → £50,000</text>
  </g>
</svg>
