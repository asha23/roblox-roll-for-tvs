name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rokit toolchain
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Check formatting
        run: stylua --check src

      - name: Lint
        run: selene src

      - name: Test game logic
        run: lune run tests/gamelogic

      - name: Build place file
        run: rojo build --output build.rbxlx

      - name: Upload place file
        uses: actions/upload-artifact@v5
        with:
          name: place-file
          path: build.rbxlx
